
name: Notifiche schedine

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: controllo-schedine
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Controlla risultati
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python controlla_schedine.py

      - name: Salva risultati controllati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stato_risultati.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna stato risultati schedine"
            git push origin HEAD:main
          fi
