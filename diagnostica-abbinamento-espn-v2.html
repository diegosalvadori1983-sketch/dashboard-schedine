<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostica abbinamenti ESPN</title><style>
*{box-sizing:border-box}body{font:16px system-ui,sans-serif;background:#f3f6fa;color:#18283c;margin:0}main{max-width:760px;margin:auto;padding:22px 14px}h1{font-size:25px}h2{font-size:19px}.card{background:#fff;border:1px solid #dce4ec;border-radius:17px;padding:17px;margin:13px 0}.row{padding:13px 0;border-top:1px solid #e5eaf0}.muted{color:#627388}.ok{color:#07845d}.bad{color:#c03936}.warn{color:#91651e}button{background:#078f78;color:white;border:0;border-radius:11px;padding:14px 17px;font-size:16px;font-weight:700}button:disabled{opacity:.6}code{overflow-wrap:anywhere;font-size:12px}small{color:#617287}b{font-weight:750}</style></head><body><main><h1>⚽ Diagnostica abbinamenti ESPN</h1><p class="muted">Confronto fra nomi squadre della dashboard V5 e nomi ricevuti da ESPN. Non usa Firebase e non modifica nulla.</p><div class="card"><button id="go">Verifica abbinamenti</button><p id="state">Pronto per il controllo.</p></div><div class="card"><h2>Risultato verifica</h2><div id="summary">In attesa.</div></div><div class="card"><h2>Partite della schedina</h2><div id="matches">In attesa.</div></div><div class="card"><h2>Elenco originale ESPN</h2><div id="raw">In attesa.</div></div></main><script>
const $=id=>document.getElementById(id);
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const alias={'werderbremen':['werderbremen','werder'],'unionberlin':['unionberlin'],'cologne':['cologne','koln'],'leedsunited':['leeds'],'bayernmunich':['bayern'],'borussiadortmund':['dortmund'],'acmilan':['milan'],'intermilan':['inter','internazionale'],'asroma':['roma'],'barcelona':['barcelona'],'alaves':['alaves'],'manchestercity':['manchestercity'],'brighton':['brighton']};
function matchTeam(want,got){let n=norm(got),k=norm(want);return(alias[k]||[k]).some(v=>n===norm(v)||norm(v).length>=5&&n.includes(norm(v)))}
function details(e){let c=e.competitions?.[0]?.competitors||[],h=c.find(x=>x.homeAway==='home'),a=c.find(x=>x.homeAway==='away');return {home:h?.team?.displayName||'',away:a?.team?.displayName||'',homeShort:h?.team?.shortDisplayName||'',awayShort:a?.team?.shortDisplayName||'',score:(h?.score??'—')+'–'+(a?.score??'—'),state:e.status?.type?.state||'?',status:e.status?.type?.name||'?',id:e.id||'?'}}
function row(parent,...pieces){let d=document.createElement('div');d.className='row';for(let p of pieces){let el=document.createElement('div');el.textContent=p;d.append(el)}parent.append(d)}
const fixtures=[['Como','Venezia'],['Frosinone','Torino'],['Lazio','Cagliari']];
$('go').onclick=async()=>{ $('go').disabled=true;$('state').textContent='Interrogazione ESPN…';let ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),15000);try{
let r=await fetch('https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/scoreboard?dates=20261101&limit=200',{cache:'no-store',signal:ctrl.signal});if(!r.ok)throw Error('HTTP '+r.status);let data=await r.json(),events=data.events||[];if(!Array.isArray(events))throw Error('Formato ESPN inatteso');$('matches').replaceChildren();$('raw').replaceChildren();let matches=0;
for(let [home,away] of fixtures){let found=events.filter(e=>{let d=details(e);return matchTeam(home,d.home)&&matchTeam(away,d.away)});let exact=events.filter(e=>{let d=details(e);return norm(home)===norm(d.home)&&norm(away)===norm(d.away)});if(found.length===1)matches++;let f=found[0]&&details(found[0]);row($('matches'),home+' – '+away,'Risultato funzione V5: '+(found.length===1?'✓ TROVATA':found.length===0?'✕ NON TROVATA':'⚠ PIÙ CORRISPONDENZE'),'Nomi ESPN: '+(f?f.home+' – '+f.away:'nessuna corrispondenza'),'Corrispondenza esatta: '+(exact.length===1?'Sì':'No'),f?'Punteggio: '+f.score+' · Stato: '+f.state:'')}
for(let e of events){let d=details(e);row($('raw'),d.home+' – '+d.away,'Nomi brevi: '+d.homeShort+' – '+d.awayShort,'Punteggio: '+d.score+' · Stato: '+d.status+' · ID: '+d.id)}
$('summary').textContent='HTTP '+r.status+' · '+events.length+' eventi ESPN · '+matches+'/'+fixtures.length+' partite riconosciute dalla funzione V5 · '+new Date().toLocaleString('it-IT');$('state').textContent='Controllo completato.';
}catch(e){$('state').textContent='Errore: '+e.message;$('summary').textContent='Verifica non riuscita: '+e.message}finally{clearTimeout(timer);$('go').disabled=false}};
</script></body></html>
