<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accesso Firebase - Schedine</title><style>body{font-family:system-ui;background:#f3f7fc;color:#142848;margin:0;padding:24px}main{max-width:480px;margin:40px auto;background:#fff;border:1px solid #dbe6f4;border-radius:18px;padding:22px}button{border:0;background:#0755b4;color:white;border-radius:10px;padding:13px;font-weight:700;font-size:16px}p{line-height:1.5}code{overflow-wrap:anywhere;background:#edf3fb;padding:8px;display:block}small{color:#536a86}</style></head><body><main><h1>Accesso Dashboard Schedine</h1><p>Questa pagina serve soltanto a registrare il tuo primo accesso Google su Firebase. Non modifica la dashboard.</p><button id="login">Accedi con Google</button><p id="msg">Non hai ancora effettuato l'accesso.</p><div id="result" hidden><strong>UID del tuo account Firebase</strong><code id="uid"></code><button id="copy">Copia UID</button><p><small>Non condividere token di accesso o password. L'UID è un identificativo, non una password.</small></p></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';const app=initializeApp({apiKey:'AIzaSyA0ZgjewMLn6rME-qfGXDrqv7CWQlc_9E4',authDomain:'dashboard-schedine.firebaseapp.com',projectId:'dashboard-schedine',appId:'1:134635694590:web:268994f0f678c8f4f4f8af'});const auth=getAuth(app);const msg=document.querySelector('#msg'),result=document.querySelector('#result'),uid=document.querySelector('#uid');onAuthStateChanged(auth,u=>{if(u){msg.textContent='Accesso riuscito.';uid.textContent=u.uid;result.hidden=false}else{msg.textContent='Non hai ancora effettuato l’accesso.';result.hidden=true}});document.querySelector('#login').onclick=async()=>{msg.textContent='Apertura accesso Google…';try{await
