(async()=>{

const css=`:root{color:#182334;background:#f4f6f8}body{background:#f4f6f8;color:#182334;font-size:15px}main{max-width:680px;padding:0 15px 38px}header{background:transparent!important;box-shadow:none!important;border-radius:0!important;margin:0 -15px 6px!important;padding:26px 18px 19px!important;color:#182334!important}header:after{display:none!important}header h1{font-size:30px!important;font-weight:850!important;letter-spacing:-1.2px;color:#101a2b!important}header p{font-size:14px!important;color:#718092!important;opacity:1!important}.panel{border:1px solid #e5e8ed!important;background:#fff!important;border-radius:24px!important;box-shadow:0 5px 18px #1423370c!important;padding:19px!important}.summary{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:0!important;margin-bottom:21px!important;background:#fff;border:1px solid #e6e9ed;border-radius:23px;overflow:hidden;box-shadow:0 5px 18px #1423370b}.stat,.stat:first-child{grid-column:auto!important;min-height:88px!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:#fff!important;padding:16px 12px!important}.stat:first-child{grid-column:1/-1!important;min-height:150px!important;padding:26px 24px!important;border-bottom:1px solid #edf0f2!important}.stat:not(:last-child):not(:first-child){border-right:1px solid #edf0f2!important}.stat small,.stat:first-child small{font-size:12px!important;font-weight:500!important;color:#788390!important}.stat:first-child small{font-size:15px!important}.stat strong,.stat:first-child strong{color:#172235!important;font-size:clamp(16px,4vw,23px)!important;white-space:normal!important;overflow-wrap:normal!important;letter-spacing:-.6px!important}.stat:first-child strong{font-size:clamp(37px,9vw,52px)!important;letter-spacing:-2px!important;margin:12px 0 0!important}.stat:first-child strong.negative{color:#d42e28!important}.stat:first-child strong.positive{color:#11986e!important}.tabs{position:sticky;top:0;z-index:12;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:5px!important;background:#f1f3f6!important;border:1px solid #e3e7eb;border-radius:999px!important;margin:0 0 19px!important;box-shadow:none!important}.tab{background:transparent!important;border:0!important;border-radius:999px!important;box-shadow:none!important;color:#657183!important;font-size:14px!important;min-height:46px!important}.tab.selected{background:#0da078!important;color:#fff!important;box-shadow:0 3px 10px #0da07823!important}.btn{background:#0da078!important;color:#fff!important;border:0!important;border-radius:999px!important;box-shadow:none!important;padding:12px 17px!important}.btn.secondary{background:#e8f7f2!important;color:#087b5c!important;border:0!important}.section-title h2,h2{color:#19263a!important}.ticket{border:1px solid #e4e8ec!important;border-radius:24px!important;box-shadow:0 6px 20px #1423370b!important;margin-bottom:16px!important}.ticket>summary,.ticket:has(.pill.won)>summary,.ticket:has(.pill.lost)>summary{background:#fff!important;border-left:5px solid #c99a45!important;padding:19px 17px!important}.ticket:has(.pill.won)>summary{border-left-color:#0da078!important}.ticket:has(.pill.lost)>summary{border-left-color:#d54a46!important}.ticket-name{color:#182334!important;font-size:16px!important;line-height:1.35}.ticket-meta{font-size:12px!important;color:#778291!important}.pill{background:#f1e9db!important;color:#a4772e!important;border-radius:999px!important}.pill.won{background:#e0f6ec!important;color:#0b8d63!important}.pill.lost{background:#fce9e8!important;color:#bf3933!important}.ticket-amount{border-top:1px dashed #e1e6eb!important;margin-top:13px!important;padding-top:13px!important;color:#788390!important}.ticket-amount b{color:#182334!important;font-size:20px!important}.ticket-amount span:last-child b{color:#0b9a70!important}.ticket-body{background:#fff!important;border-top:1px solid #edf0f2!important}.event,.event:nth-child(even){margin:0!important;border:0!important;border-bottom:1px solid #e9edf0!important;border-radius:0!important;box-shadow:none!important;background:#fff!important;padding:16px 19px!important}.event:last-child{border-bottom:0!important}.event-teams,.match{color:#1c293a!important}.event-date{color:#718092!important}.pick-panel{background:#f4f7f8!important;border:1px solid #edf0f2!important}.status.good,.result-label.good{color:#0a936a!important}.status.bad,.result-label.bad{color:#ce3b36!important}.event-index{color:#8c98a5!important}.progress-v6{display:flex;gap:5px;margin:15px 0 6px}.progress-v6 i{display:block;flex:1;height:8px;border-radius:99px;background:#e2e8ee}.progress-v6 i.good{background:#0ca277}.progress-v6 i.bad{background:#d44a45}.progress-v6 i.live{background:#c18b31}.progress-v6-label{font-size:12px;color:#718092}@media(max-width:380px){.stat{padding:13px 8px!important}.stat strong{font-size:16px!important}.ticket-name{font-size:14px!important}}`;

s=s.replace('document.getElementById(\'sync-login\')','document.getElementById(\'sync-login\')');
