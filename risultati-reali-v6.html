<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V6 - Risultati reali, sola lettura</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fc;color:#193653;font:15px system-ui}main{max-width:760px;margin:auto;padding:22px 15px 50px}h1{font-size:25px}.card{background:#fff;border:1px solid #d8e4f0;border-radius:17px;padding:20px;margin:16px 0}.item{padding:13px 0;border-top:1px solid #e5eaf1}button{width:100%;padding:16px;border:0;border-radius:12px;background:#095ab6;color:white;font-size:16px;font-weight:800}button:disabled{opacity:.55}.sub{color:#64748b;font-size:13px;line-height:1.65}.ok{color:#147b4a}.warn{color:#94650e}.pill{display:inline-block;background:#edf3fc;border-radius:8px;padding:6px 9px;margin:4px;font-size:12px}a{color:#095ab6}</style></head><body><main><h1>⚽ V6 · Risultati reali</h1><p class="sub">Controllo in sola lettura delle schedine aggiunte a Firebase. I risultati sono informativi: nessun esito Vinta/Persa viene assegnato, nessun dato viene salvato e la dashboard V5 non cambia.</p><section class="card"><button id="start">Accedi e controlla i risultati</button><p class="sub" id="state">In attesa.</p></section><section class="card" id="summary" hidden></section><div id="results"></div><p><a href="./">Torna alla dashboard V5</a></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
import {getAuth,GoogleAuthProvider,signInWithPopup} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
import {getFirestore,doc,getDoc} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';
const app=initializeApp({apiKey:'AIzaSyA0ZgjewMLn6rME-qfGXDrqv7CWQlc_9E4',authDomain:'dashboard-schedine.firebaseapp.com',projectId:'dashboard-schedine',appId:'1:134635694590:web:268994f0f678c8f4f4f8af'});
const auth=getAuth(app),db=getFirestore(app),allowed='7TYbhmqD2Ad9wbzD1Fy5D0Lflsu1',worker='https://dashboard-schedine-risultati.diegosalvadori1983.workers.dev';
const $=s=>document.querySelector(s),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=x=>String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
const groups=[['marsiglia','marseille','olympique de marseille','olympique marseille'],['tolosa','tolosa fc','toulouse','toulouse fc'],['lione','lyon','olympique lyonnais','olympique lyon'],['racing santander','racing de santander','real racing club','racing club de santander'],['inter','internazionale','inter milan','fc internazionale milano'],['roma','as roma','roma calcio'],['milan','ac milan','milan ac'],['lazio','ss lazio'],['como','como 1907','como calcio'],['venezia','venezia fc'],['frosinone','frosinone calcio'],['torino','torino fc'],['cagliari','cagliari calcio'],['angers','angers sco'],['arsenal','arsenal fc'],['liverpool','liverpool fc'],['real madrid','real madrid cf']];
const gi=new Map();groups.forEach((g,i)=>g.forEach(x=>gi.set(norm(x),i)));
function same(a,b){const x=norm(a),y=norm(b);return !!x&&!!y&&(x===y||(gi.has(x)&&gi.get(x)===gi.get(y)))}
function dateOf(l){const s=String(l?.[3]||'');if(/^\d{8}$/.test(s))return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6);return String(l?.[4]||'').match(/\d{4}-\d{2}-\d{2}/)?.[0]||null}
function shift(d,n){let x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function team(name,t){return [t?.name,t?.shortName,t?.tla].some(v=>same(name,v))}
function matches(l,arr){return arr.filter(m=>team(l[0],m.homeTeam)&&team(l[1],m.awayTeam))}
$('#start').onclick=async()=>{const btn=$('#start'),state=$('#state');btn.disabled=true;try{state.textContent='Accesso a Firebase…';let u=auth.currentUser;if(!u)u=(await signInWithPopup(auth,new GoogleAuthProvider())).user;if(u.uid!==allowed)throw Error('Account non autorizzato');let snap=await getDoc(doc(db,'schedine',u.uid));if(!snap.exists())throw Error('Archivio non trovato');let tickets=Array.isArray(snap.data().extra)?snap.data().extra:[],legs=tickets.flatMap(t=>(Array.isArray(t.legs)?t.legs:[]).map(l=>({t,l,date:dateOf(l)})));let dates=[...new Set(legs.map(x=>x.date).filter(Boolean))];state.textContent='Recupero risultati per '+dates.length+' date…';let byDate={};for(let d of dates){try{let res=await fetch(`${worker}/matches?dateFrom=${d}&dateTo=${shift(d,1)}`,{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);let data=await res.json();if(!Array.isArray(data.matches))throw Error('Risposta API incompleta');byDate[d]=data.matches}catch(e){byDate[d]=null;console.warn(d,e)}}let matched=0,finished=0,pending=0,missing=0,uncertain=0;let root=$('#results');root.replaceChildren();for(let t of tickets){let section=document.createElement('section');section.className='card';let rows=legs.filter(x=>x.t===t);let html=`<h2>${esc(t.code||'')} · ${esc(t.name||'Schedina')}</h2><p class="sub">${rows.length} selezioni · Puntata ${esc(t.stake)} €</p>`;for(let x of rows){let arr=x.date?byDate[x.date]:null;let label='',cls='warn',detail='';if(arr===null||arr===undefined){label='Dati API non disponibili / data assente';uncertain++}else{let candidates=matches(x.l,arr);if(candidates.length===1){let m=candidates[0];matched++;if(m.status==='FINISHED'&&Number.isInteger(m.score?.fullTime?.home)&&Number.isInteger(m.score?.fullTime?.away)){finished++;cls='ok';label='Risultato finale disponibile (da confermare)';detail=`${m.score.fullTime.home}–${m.score.fullTime.away}`}else{pending++;label='In attesa: partita non conclusa'}detail+=` · ${m.competition?.name||''} · ${m.status||''}`}else if(candidates.length>1){uncertain++;label='Più incontri compatibili: verifica necessaria'}else{missing++;label='Partita non trovata nella data: verifica necessaria'}}html+=`<div class="item"><strong>${esc(x.l[0])} – ${esc(x.l[1])}</strong><div class="sub">${esc(x.date||'Data assente')} · Pronostico: ${esc(x.l[6]||'—')} · Quota: ${esc(x.l[7]||'—')}</div><div class="sub ${cls}">${esc(label)}${esc(detail)}</div></div>`}section.innerHTML=html;root.append(section)}$('#summary').hidden=false;$('#summary').innerHTML=`<h2>Riepilogo risultati</h2><span class="pill">${tickets.length} schedine</span><span class="pill">${legs.length} selezioni</span><span class="pill">${matched} abbinate</span><span class="pill">${finished} concluse</span><span class="pill">${pending} in attesa</span><span class="pill">${missing} non trovate</span><span class="pill">${uncertain} da verificare</span><p class="sub">Le corrispondenze sono preliminari: per assegnare esiti occorre verificare identità, data e orario dell'incontro. Nessun risultato viene scritto in Firebase.</p>`;state.textContent='Controllo completato in sola lettura.'}catch(e){state.textContent='Errore: '+(e.code||e.message||String(e));console.error(e)}finally{btn.disabled=false}};
</script></body></html>
