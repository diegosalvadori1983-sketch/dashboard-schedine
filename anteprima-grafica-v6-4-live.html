<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le mie schedine — V6.4 Live</title>
<style>
html,body{margin:0;height:100%;background:#f4f6f8}
iframe{border:0;width:100%;height:100dvh;display:block}
</style></head><body>
<iframe id="dashboard" title="Le mie schedine, anteprima live"
src="./anteprima-grafica-v6-2.html"></iframe>
<script>
const compactCSS=`
/* Anteprima V6.4 - solo modifiche grafiche */
.ticket-body .event{padding:9px 10px!important;margin:0!important;border-radius:0!important;box-shadow:none!important}
.ticket-body .event-head{margin-bottom:3px!important}
.ticket-body .match{font-size:15px!important;line-height:1.3!important}
.ticket-body .when{font-size:11px!important}
.ticket-body .bet{padding:5px 7px!important;margin-top:4px!important}
.ticket-body .event-footer{margin-top:5px!important}
.ticket-body .manual{margin-top:6px!important;padding-top:6px!important}
.ticket-body .manual select{min-height:35px!important;padding:6px 8px!important}
.ticket-body .status{padding:4px 6px!important}
.ticket>summary{padding:12px!important}
`;
const frame=document.getElementById('dashboard');
function apply(){
  try{
    const d=frame.contentDocument;
    if(!d||!d.head||d.getElementById('v64-compact'))return;
    const st=d.createElement('style');
    st.id='v64-compact';st.textContent=compactCSS;d.head.appendChild(st);
  }catch(e){console.warn('Anteprima non accessibile:',e)}
}
frame.addEventListener('load',apply);
</script></body></html>
