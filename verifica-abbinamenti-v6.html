<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verifica abbinamenti V6</title><style>*{box-sizing:border-box}body{margin:0;background:#eef4fc;color:#193456;font:15px system-ui}main{max-width:660px;margin:auto;padding:20px 14px}h1{font-size:23px}.box{background:white;border:1px solid #d5e2f2;border-radius:15px;padding:16px;margin:12px 0}.small{color:#60758e;font-size:13px}button{width:100%;padding:15px;background:#0860bc;color:white;border:0;border-radius:11px;font-size:16px;font-weight:750}.item{border-top:1px solid #e5edf7;padding:12px 0}.ok{color:#087a4a}.warn{color:#a36a0a}.bad{color:#b12b40}strong{overflow-wrap:anywhere}</style></head><body><main><h1>⚽ V6 · Verifica abbinamenti</h1><p class="small">Controllo in sola lettura. Non accede a Firebase, non modifica le schedine e non sostituisce la V5.</p><div class="box"><button id="go">Controlla le partite del 1° novembre</button><p id="status" class="small">Pronto per il controllo.</p></div><div id="results" class="box" hidden></div></main><script>
const endpoint='https://dashboard-schedine-risultati.diegosalvadori1983.workers.dev/matches?dateFrom=2026-11-01&dateTo=2026-11-02';
const legs=[['Marsiglia','Tolosa FC'],['Como','Venezia'],['Frosinone','Torino'],['Lazio','Cagliari'],['Racing Santander','Real Madrid'],['Liverpool','Arsenal'],['Lione','Angers']];
const alias={'marsiglia':['marseille','olympique de marseille'],'tolosa fc':['toulouse','toulouse fc'],'lione':['lyon','olympique lyonnais'],'como':['como','como 1907'],'venezia':['venezia'],'frosinone':['frosinone'],'torino':['torino'],'lazio':['lazio'],'cagliari':['cagliari'],'racing santander':['racing santander','racing de santander'],'real madrid':['real madrid'],'liverpool':['liverpool'],'arsenal':['arsenal'],'angers':['angers']};
function norm(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'')}
function team(want,got){let n=norm(got);return (alias[want.toLowerCase()]||[want]).some(a=>{let x=norm(a);return x.length>=4&&(n===x||n.startsWith(x)||x.startsWith(n)&&n.length>=5)})}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.getElementById('go').onclick=async()=>{let btn=document.getElementById('go'),st=document.getElementById('status'),out=document.getElementById('results');btn.disabled=true;st.textContent='Recupero risultati…';out.hidden=true;try{let r=await fetch(endpoint,{cache:'no-store'}),data=await r.json();if(!r.ok)throw Error('HTTP '+r.status+': '+JSON.stringify(data).slice(0,180));let matches=data.matches||[];st.textContent='HTTP '+r.status+' · '+matches.length+' partite restituite. Solo corrispondenze certe.';out.hidden=false;out.innerHTML='<h2>Controllo delle partite importate</h2>'+legs.map(([h,a])=>{let candidates=matches.filter(m=>team(h,m.homeTeam?.name||m.homeTeam?.shortName)&&team(a,m.awayTeam?.name||m.awayTeam?.shortName));let match=candidates[0];let info=candidates.length===1?'<span class="ok">✓ Corrispondenza unica</span> · '+esc(match.competition?.name)+' · '+esc(match.status)+' · '+esc(match.score?.fullTime?.home??'—')+'-'+esc(match.score?.fullTime?.away??'—'):candidates.length>1?'<span class="warn">⚠ Più corrispondenze: da verificare</span>':'<span class="warn">⚠ Non trovata: da verificare</span>';return '<div class="item"><strong>'+esc(h)+' – '+esc(a)+'</strong><div class="small">'+info+'</div></div>'}).join('')+'<p class="small">La verifica dei pronostici richiede ulteriori controlli: questa pagina non assegna esiti e non salva dati.</p>'}catch(e){st.textContent='Errore: '+e.message}finally{btn.disabled=false}};
</script></body></html>
