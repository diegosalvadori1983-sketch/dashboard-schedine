<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V6 Test pronostici</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4fc;color:#183451;font:15px system-ui,sans-serif}main{max-width:760px;margin:auto;padding:22px 14px}h1{font-size:25px;color:#103e77}.card{background:white;border:1px solid #d6e4f2;border-radius:17px;padding:18px;margin:14px 0}button{width:100%;background:#075bb6;color:white;border:0;border-radius:12px;padding:16px;font-size:16px;font-weight:800}.sub{color:#62758b;font-size:13px;line-height:1.5}.item{border-top:1px solid #e2eaf2;padding:13px 0}.ok{color:#137c4c}.bad{color:#b23b3b}a{color:#075bb6}</style></head><body><main><h1>⚽ V6 · Test pronostici</h1><p class="sub">Test con risultati fittizi. Non accede a Firebase e non modifica le schedine né la dashboard V5.</p><section class="card"><button id="run">Esegui 21 controlli</button><p id="summary" class="sub">Pronto per il test.</p></section><section class="card" id="details" hidden></section><p class="sub"><a href="./">Torna alla dashboard V5</a></p></main><script>
function outcome(pred,m){if(m.status!=='FINISHED')return 'wait';const h=m.score?.fullTime?.home,a=m.score?.fullTime?.away;if(!Number.isInteger(h)||!Number.isInteger(a))return 'warn';const clean=String(pred||'').trim().toLowerCase().replace(/,/g,'.').replace(/\s+/g,' ');const parts=clean.split(/\s*\+\s*/).map(x=>x.trim());function test(x){if(x==='1')return h>a;if(x==='x')return h===a;if(x==='2')return h<a;if(x==='gol'||x==='goal'||x==='gg')return h>0&&a>0;if(x==='nogol'||x==='no gol'||x==='no goal'||x==='ng')return h===0||a===0;const o=x.match(/^(over|under)\s*(\d+(?:\.\d+)?)$/);if(o){const n=Number(o[2]);if(!Number.isFinite(n)||Number.isInteger(n))return null;return o[1]==='over'?h+a>n:h+a<n}return null}const values=parts.map(test);if(!parts.length||values.some(x=>x===null))return 'warn';return values.every(Boolean)?'win':'lose'}
const tests=[['1',2,0,'win'],['1',1,1,'lose'],['X',0,0,'win'],['X',0,1,'lose'],['2',0,2,'win'],['2',2,1,'lose'],['Gol',1,1,'win'],['Gol',2,0,'lose'],['No Gol',3,0,'win'],['No Gol',1,1,'lose'],['Over 1,5',1,1,'win'],['Over 2,5',1,1,'lose'],['Under 2,5',1,1,'win'],['Under 1,5',1,1,'lose'],['1 + Over 1,5',2,0,'win'],['1 + Over 2,5',2,0,'lose'],['1 + Over 2,5',2,1,'win'],['2 + Gol',1,2,'win'],['Risultato esatto 2-1',2,1,'warn'],['Under 2',1,0,'warn']];
document.querySelector('#run').onclick=()=>{const results=tests.map(([p,h,a,expected])=>({p,h,a,expected,actual:outcome(p,{status:'FINISHED',score:{fullTime:{home:h,away:a}}})}));const pending=outcome('1',{status:'TIMED',score:{fullTime:{home:null,away:null}}});const all=[...results.map(r=>r.expected===r.actual),pending==='wait'];const passed=all.filter(Boolean).length;document.querySelector('#summary').innerHTML=`<strong class="${passed===all.length?'ok':'bad'}">${passed} controlli superati su ${all.length}</strong> · ${all.length-passed} errori. Nessun dato reale modificato.`;document.querySelector('#details').hidden=false;document.querySelector('#details').innerHTML='<h2>Dettaglio controlli</h2>'+results.map(r=>`<div class="item"><b>${r.p} · risultato ${r.h}–${r.a}</b><div class="${r.actual===r.expected?'ok':'bad'}">${r.actual===r.expected?'✓':'✗'} Atteso: ${r.expected} · Ottenuto: ${r.actual}</div></div>`).join('')+`<div class="item"><b>Partita non conclusa</b><div class="${pending==='wait'?'ok':'bad'}">Atteso: wait · Ottenuto: ${pending}</div></div>`};
</script></body></html>
